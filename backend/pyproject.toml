[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = [".venv", "nltk_data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S608"]  # asserts in tests; S608 flags f-string SQL, only used for the validated schema name

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
