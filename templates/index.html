<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Resume Screening & Job Matching</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-wrap">
        <div class="hero container">
            <div class="hero-card">
                <div class="hero-header">
                    <h1>AI Resume Screening</h1>
                    <p class="hero-subtitle">Rank candidates with NLP, skills matching, and optional semantic similarity.</p>
                </div>

                {% if error %}
                <div class="alert alert-warning">{{ error }}</div>
                {% endif %}

                <form action="/upload-resumes" method="post" enctype="multipart/form-data" class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Upload Resumes (PDF or DOCX)</label>
                        <input class="form-control" type="file" name="resumes" multiple required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Job Description</label>
                        <textarea class="form-control" name="job_description" rows="7" placeholder="Paste the job description here" required></textarea>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary w-100" type="submit">Rank Resumes</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</body>
</html>
